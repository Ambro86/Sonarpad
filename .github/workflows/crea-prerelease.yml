name: Crea Prerelease (Windows)

on:
  workflow_dispatch:

jobs:
  create-prerelease:
    name: Create/Replace Prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Read version from Cargo.toml
      run: |
        python - <<'PY'
        import os
        import pathlib
        import tomllib

        data = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))
        version = data['package']['version']

        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
            env.write(f"APP_VERSION={version}\n")
        PY

    - name: Resolve next beta tag and previous prereleases
      id: beta_meta
      uses: actions/github-script@v7
      with:
        script: |
          const version = process.env.APP_VERSION;
          const prefix = `v${version}-beta`;
          const forcedBeta = 6;
          let page = 1;
          const releases = [];
          while (true) {
            const resp = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
              page
            });
            releases.push(...resp.data);
            if (resp.data.length < 100) break;
            page += 1;
          }

          const existingPrereleaseTags = [];
          for (const rel of releases) {
            if (rel.prerelease) {
              existingPrereleaseTags.push(rel.tag_name);
            }
            if (!rel.tag_name.startsWith(prefix)) continue;
          }

          const nextBeta = forcedBeta;
          const nextTag = `${prefix}${nextBeta}`;
          const nextTitle = `Sonarpad v${version} beta${nextBeta}`;

          core.setOutput('next_tag', nextTag);
          core.setOutput('next_title', nextTitle);
          core.setOutput('delete_tags_json', JSON.stringify(existingPrereleaseTags));

    - name: Get successful CI run for this exact commit
      id: get_run
      uses: actions/github-script@v7
      with:
        script: |
          const targetSha = context.sha;
          const runs = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'ci.yml',
            head_sha: targetSha,
            status: 'success',
            per_page: 100
          });

          const eligibleRuns = runs.data.workflow_runs.filter(run =>
            run.head_sha === targetSha &&
            (run.event === 'push' || run.event === 'workflow_dispatch')
          );

          if (eligibleRuns.length === 0) {
            core.setFailed(
              `No successful ci.yml run found for commit ${targetSha}. ` +
              'Run ci.yml for this exact commit before creating the prerelease.'
            );
            return;
          }

          const selectedRun = eligibleRuns[0];
          if (selectedRun.head_sha !== targetSha) {
            core.setFailed(`Build SHA mismatch: expected ${targetSha}, got ${selectedRun.head_sha}`);
            return;
          }

          console.log(`Selected CI run: ${selectedRun.id} for commit ${selectedRun.head_sha}`);
          core.setOutput('run_id', String(selectedRun.id));
          core.setOutput('run_sha', selectedRun.head_sha);
          core.setOutput('run_sha_short', selectedRun.head_sha.substring(0, 7));
          core.setOutput('run_date', selectedRun.created_at);

    - name: Download artifacts from matching CI run
      uses: actions/download-artifact@v4
      with:
        run-id: ${{ steps.get_run.outputs.run_id }}
        path: ./artifacts
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Collect prerelease files
      run: |
        mkdir -p release_files
        for artifact_dir in ./artifacts/*/; do
          if [ -d "$artifact_dir" ]; then
            find "$artifact_dir" -type f \( -name "*.exe" -o -name "*.msi" -o -name "SHA256SUMS.txt" -o -name "GITHUB_BUILD_INFO.txt" \) -print -exec cp "{}" release_files/ \;
          fi
        done

        file_count=$(find release_files -type f | wc -l)
        if [ "$file_count" -eq 0 ]; then
          echo "ERROR: no release files found in artifacts"
          find ./artifacts -maxdepth 3 -type f -print
          exit 1
        fi

        for file in release_files/*-setup.exe; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            newname=$(echo "$filename" | sed -E "s/_(v)?[0-9]+(\\.[0-9]+)+_/_/")
            if [ "$filename" != "$newname" ]; then
              mv "$file" "release_files/$newname"
            fi
          fi
        done

        for file in release_files/*.msi; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            newname=$(echo "$filename" | sed -E "s/_(v)?[0-9]+(\\.[0-9]+)+_/_/")
            if [ "$filename" != "$newname" ]; then
              mv "$file" "release_files/$newname"
            fi
          fi
        done

        ls -la release_files

    - name: Verify artifact commit provenance
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        python - <<'PY'
        import os
        import pathlib
        import re

        info_path = pathlib.Path("release_files/GITHUB_BUILD_INFO.txt")
        if not info_path.is_file():
            raise SystemExit("ERROR: GITHUB_BUILD_INFO.txt is missing from the CI artifacts")

        text = info_path.read_text(encoding="utf-8-sig", errors="replace")
        match = re.search(r"^Commit SHA:\s*([0-9a-fA-F]{40})\s*$", text, re.MULTILINE)
        if not match:
            raise SystemExit("ERROR: Commit SHA not found in GITHUB_BUILD_INFO.txt")

        artifact_sha = match.group(1).lower()
        expected_sha = os.environ["EXPECTED_SHA"].lower()
        if artifact_sha != expected_sha:
            raise SystemExit(
                f"ERROR: artifacts belong to commit {artifact_sha}, "
                f"but prerelease requires {expected_sha}"
            )

        print(f"Artifact provenance verified for commit {artifact_sha}")
        PY

    - name: Build prerelease notes from latest changelog section
      run: |
        python - <<'PY'
        import os
        import pathlib
        import re

        changelog_path = pathlib.Path('CHANGELOG.md')
        text = changelog_path.read_text(encoding='utf-8')

        version = os.environ['APP_VERSION']
        header_pattern = re.compile(rf"^Version\s+{re.escape(version)}\s+[-–].*$", re.MULTILINE)
        next_header_pattern = re.compile(r"^Version\s+\d+\.\d+\.\d+\s+[-–].*$", re.MULTILINE)

        m = header_pattern.search(text)
        if not m:
          notes = f"Beta build for version {version}.\n\nLatest changelog section not found in CHANGELOG.md."
        else:
          start = m.start()
          n = next_header_pattern.search(text, m.end())
          end = n.start() if n else len(text)
          section = text[start:end].strip()
          notes = f"Beta prerelease for Sonarpad {version}.\n\n{section}"

        pathlib.Path('prerelease_notes.md').write_text(notes + '\n', encoding='utf-8')
        PY

    - name: Delete existing prereleases
      uses: actions/github-script@v7
      with:
        script: |
          const raw = `${{ steps.beta_meta.outputs.delete_tags_json }}`;
          const tags = JSON.parse(raw || '[]');
          for (const tag of tags) {
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id
            });
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
            } catch (_) {
            }
          }

    - name: Create prerelease
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ steps.beta_meta.outputs.next_tag }}" \
          release_files/* \
          --target "${GITHUB_SHA}" \
          --title "${{ steps.beta_meta.outputs.next_title }}" \
          --notes-file prerelease_notes.md \
          --prerelease

    - name: Summary
      run: |
        echo "Prerelease created/replaced successfully"
        echo "Tag: ${{ steps.beta_meta.outputs.next_tag }}"
        echo "Build ID: ${{ steps.get_run.outputs.run_id }}"
        echo "Build SHA: ${{ steps.get_run.outputs.run_sha_short }}"
        echo "Assets:"
        ls -la release_files | sed 's/^/  /'
