name: Create Release (Windows)

on:
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Read version from Cargo.toml
      run: |
        python - <<'PY'
        import os
        import pathlib
        import tomllib

        data = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
        version = data["package"]["version"]
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
            env.write(f"RELEASE_VERSION=v{version}\n")
        PY

    - name: Get successful CI run for this exact commit
      id: get_run
      uses: actions/github-script@v7
      with:
        script: |
          const targetSha = context.sha;
          const runs = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'ci.yml',
            head_sha: targetSha,
            status: 'success',
            per_page: 100
          });

          const eligibleRuns = runs.data.workflow_runs.filter(run =>
            run.head_sha === targetSha &&
            (run.event === 'push' || run.event === 'workflow_dispatch')
          );

          if (eligibleRuns.length === 0) {
            core.setFailed(
              `Nessuna build CI riuscita trovata per il commit ${targetSha}. ` +
              'Esegui prima ci.yml sullo stesso commit, poi riprova la release.'
            );
            return;
          }

          const selectedRun = eligibleRuns[0];
          console.log(`Selected CI run: ${selectedRun.id} for commit ${selectedRun.head_sha}`);

          if (selectedRun.head_sha !== targetSha) {
            core.setFailed(`Build SHA mismatch: expected ${targetSha}, got ${selectedRun.head_sha}`);
            return;
          }

          core.setOutput('run_id', String(selectedRun.id));
          core.setOutput('run_date', selectedRun.created_at);
          core.setOutput('run_sha', selectedRun.head_sha);
          core.setOutput('run_sha_short', selectedRun.head_sha.substring(0, 7));

    - name: Download all artifacts from matching CI build
      uses: actions/download-artifact@v4
      with:
        run-id: ${{ steps.get_run.outputs.run_id }}
        path: ./artifacts
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract zip artifacts
      run: |
        echo "=== Estrazione zip ==="
        find ./artifacts -type f -name "*.zip" -print -exec unzip -o "{}" -d "$(dirname "{}")" \;

    - name: Collect release files
      id: prepare_files
      run: |
        mkdir -p release_files

        echo "=== Raccolta artifacts ==="
        for artifact_dir in ./artifacts/*/; do
          if [ -d "$artifact_dir" ]; then
            echo "Processando artifact: $(basename "$artifact_dir")"
            find "$artifact_dir" -type f \( -name "*.exe" -o -name "*.msi" -o -name "SHA256SUMS.txt" -o -name "GITHUB_BUILD_INFO.txt" \) -print -exec cp "{}" release_files/ \;
          fi
        done

        echo "=== File preparati per la release ==="
        ls -la release_files/

        file_count=$(find release_files -type f | wc -l)
        echo "Numero totale di file: $file_count"

        if [ $file_count -eq 0 ]; then
          echo "ERRORE: Nessun file trovato per la release!"
          exit 1
        fi

        echo "=== Rinomina setup (rimozione versione) ==="
        for file in release_files/*-setup.exe; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            newname=$(echo "$filename" | sed -E "s/_(v)?[0-9]+(\\.[0-9]+)+_/_/")
            if [ "$filename" != "$newname" ]; then
              mv "$file" "release_files/$newname"
              echo "Rinominato: $filename -> $newname"
            else
              echo "Nessuna rinomina per: $filename"
            fi
          fi
        done

        echo "=== Rinomina MSI (rimozione versione) ==="
        for file in release_files/*.msi; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            newname=$(echo "$filename" | sed -E "s/_(v)?[0-9]+(\\.[0-9]+)+_/_/")
            if [ "$filename" != "$newname" ]; then
              mv "$file" "release_files/$newname"
              echo "Rinominato: $filename -> $newname"
            else
              echo "Nessuna rinomina per: $filename"
            fi
          fi
        done

        echo "file_count=$file_count" >> $GITHUB_OUTPUT

    - name: Verify artifact commit provenance
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        python - <<'PY'
        import os
        import pathlib
        import re

        info_path = pathlib.Path("release_files/GITHUB_BUILD_INFO.txt")
        if not info_path.is_file():
            raise SystemExit("ERRORE: GITHUB_BUILD_INFO.txt mancante negli artefatti della build")

        text = info_path.read_text(encoding="utf-8-sig", errors="replace")
        match = re.search(r"^Commit SHA:\s*([0-9a-fA-F]{40})\s*$", text, re.MULTILINE)
        if not match:
            raise SystemExit("ERRORE: Commit SHA non trovato in GITHUB_BUILD_INFO.txt")

        artifact_sha = match.group(1).lower()
        expected_sha = os.environ["EXPECTED_SHA"].lower()
        if artifact_sha != expected_sha:
            raise SystemExit(
                f"ERRORE: gli artefatti appartengono al commit {artifact_sha}, "
                f"ma la release richiede {expected_sha}"
            )

        print(f"Artefatti verificati: commit {artifact_sha}")
        PY

    - name: Create release (if missing)
      run: |
        if gh release view "${{ env.RELEASE_VERSION }}" >/dev/null 2>&1; then
          echo "Release ${RELEASE_VERSION} already exists. Skipping creation."
        else
          gh release create "${{ env.RELEASE_VERSION }}" \
            --target "${GITHUB_SHA}" \
            --title "Sonarpad Release ${{ env.RELEASE_VERSION }}" \
            --notes "Build: ${{ steps.get_run.outputs.run_id }} (${{ steps.get_run.outputs.run_sha_short }})"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload release assets
      run: |
        echo "Caricamento assets..."

        for file in release_files/*; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            echo "Caricamento di $filename..."
            gh release upload "${{ env.RELEASE_VERSION }}" "$file" --clobber
          fi
        done

        echo "Tutti i file sono stati caricati!"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Summary
      run: |
        echo "Release creata con successo!"
        echo "Tag: ${{ env.RELEASE_VERSION }}"
        echo "Build ID: ${{ steps.get_run.outputs.run_id }}"
        echo "Files caricati: ${{ steps.prepare_files.outputs.file_count }}"
        echo ""
        echo "Files nella release:"
        ls -la release_files/ | sed 's/^/  /'
        echo ""
        echo "Link alla release: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_VERSION }}"
