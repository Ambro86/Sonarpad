[package]
name = "sonarpad"
version = "0.9.10"
edition = "2024"
authors = ["Ambrogio Riili"]
description = "A modern Notepad with PDF, DOCX, XLS, EPUB, Kindle and DAISY support and TTS capabilities."

[package.metadata.packager]
product_name = "Sonarpad"
identifier = "com.ambrogioriili.sonarpad"
authors = ["Ambrogio Riili"]
publisher = "Ambrogio Riili"
description = "A modern Notepad with PDF, DOCX, XLS, EPUB, Kindle and DAISY support and TTS capabilities."
formats = ["nsis", "wix"]

[[package.metadata.packager.file_associations]]
extensions = ["txt"]
description = "Sonarpad Text Document"
name = "Sonarpad Text Document"

[[package.metadata.packager.file_associations]]
extensions = ["doc", "docx"]
description = "Sonarpad Word Document"
name = "Sonarpad Word Document"

[[package.metadata.packager.file_associations]]
extensions = ["odt"]
description = "Sonarpad OpenDocument Text"
name = "Sonarpad OpenDocument Text"

[[package.metadata.packager.file_associations]]
extensions = ["epub"]
description = "Sonarpad EPUB Document"
name = "Sonarpad EPUB Document"

[[package.metadata.packager.file_associations]]
extensions = ["mobi", "azw", "azw3"]
description = "Sonarpad Kindle eBook"
name = "Sonarpad Kindle eBook"

[[package.metadata.packager.file_associations]]
extensions = ["daisy", "opf", "ncx", "smil"]
description = "Sonarpad DAISY Digital Talking Book"
name = "Sonarpad DAISY Digital Talking Book"

[[package.metadata.packager.file_associations]]
extensions = ["pdf"]
description = "Sonarpad PDF Document"
name = "Sonarpad PDF Document"

[[package.metadata.packager.file_associations]]
extensions = ["xls"]
description = "Sonarpad Excel Document"
name = "Sonarpad Excel Document"

[[package.metadata.packager.file_associations]]
extensions = ["html", "htm"]
description = "Sonarpad HTML Document"
name = "Sonarpad HTML Document"

[[package.metadata.packager.file_associations]]
extensions = ["ppt", "pptx"]
description = "Sonarpad PowerPoint Document"
name = "Sonarpad PowerPoint Document"

[[package.metadata.packager.file_associations]]
extensions = ["odp"]
description = "Sonarpad OpenDocument Presentation"
name = "Sonarpad OpenDocument Presentation"

[[package.metadata.packager.file_associations]]
extensions = ["py", "java", "js", "rb", "pl", "php", "lua", "ps1", "sh"]
description = "Sonarpad Programming File"
name = "Sonarpad Programming File"

[[package.metadata.packager.file_associations]]
extensions = [
  "mp3",
  "m4a",
  "mp4",
  "aac",
  "mkv",
  "avi",
  "mov",
  "m4v",
  "webm",
  "mpg",
  "mpeg",
  "ts",
  "m2ts",
  "mts",
  "wmv",
  "asf",
  "flv",
  "vob",
  "3gp",
  "flac",
  "ogg",
  "opus",
  "wma",
  "aiff",
  "m4b",
  "wav",
]
description = "Sonarpad Audio File"
name = "Sonarpad Audio File"

[[package.metadata.packager.file_associations]]
extensions = ["md"]
description = "Sonarpad Markdown Document"
name = "Sonarpad Markdown Document"

[[package.metadata.packager.file_associations]]
extensions = ["gdoc", "gsheet", "gslides"]
description = "Google Drive Shortcut"
name = "Google Drive Shortcut"

[[package.metadata.packager.binaries]]
path = "sonarpad"
main = true

[package.metadata.packager.nsis]
languages = ["English", "Italian", "Spanish", "Portuguese", "Swedish", "Vietnamese", "Czech", "Serbian", "Ukrainian", "SimpChinese", "Lithuanian"]
template = "packager/nsis/installer.nsi"

[package.metadata.packager.wix]
template = "packager/wix/main.wxs"
languages = [
  { identifier = "en-US", path = "packager/wix/locales/en-US.wxl" },
]

[dependencies]
windows = { version = "0.54", features = [
  "implement",
  "Globalization",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Data_Pdf",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_SystemServices",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Speech",
  "Win32_Media_Multimedia",
  "Win32_Media_MediaFoundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Controls_RichEdit",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
encoding_rs = "0.8"
docx-rs = "0.4"
pdf-extract = "0.10"
pdfium-render = { version = "0.8.37", default-features = false, features = ["pdfium_latest", "thread_safe"] }
lopdf = "0.38"
printpdf = "0.8"
calamine = "0.32"
cfb = "0.12"
quick-xml = "0.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
flate2 = "1.1"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hex = "0.4"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "blocking", "json", "socks"] }
curl = "0.4"
curl-sys = "0.4"
rodio = { version = "0.21", features = ["symphonia-aac", "symphonia-isomp4", "symphonia-mkv"] }
sha2 = "0.10"
sha1 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["mkv"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
cpal = "0.17"
url = "2.5"
uuid = { version = "1.19", features = ["v4"] }
epub = "2.1"
ebook-rs = { version = "=0.14.1", default-features = false, features = ["serde"] }
zip = "0.6"
feed-rs = "2.3"
scraper = "0.25"
httpdate = "1.0"
mp3-duration = "0.1"
fancy-regex = "0.17"
sevenz-rust = "0.6"
once_cell = "1.21"
libloading = "0.8"
libc = "0.2"
whisper-rs = { version = "0.14", default-features = false }
hound = "3.5"
sentry = { version = "0.35", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
webview2 = "0.1.4"
winapi = { version = "0.3", features = ["winuser"] }

[build-dependencies]
bindgen = { version = "0.70", default-features = false, features = ["runtime"] }

[features]
portable = []
standalone = []
whisper_cuda = ["whisper-rs/cuda"]

[profile.dev.package.symphonia]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-format-isomp4]
opt-level = 3

[profile.dev.package.symphonia-codec-aac]
opt-level = 3

[profile.dev.package.rodio]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
debug = 0
strip = true
