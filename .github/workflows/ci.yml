name: Build and Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  SONARPAD_ROUTE_CLIENT_TOKEN: ${{ secrets.SONARPAD_ROUTE_CLIENT_TOKEN }}

jobs:
  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Validate route token secret
      if: github.event_name != 'pull_request'
      shell: powershell
      run: |
        if ([string]::IsNullOrWhiteSpace($env:SONARPAD_ROUTE_CLIENT_TOKEN)) {
          throw "Missing repository secret SONARPAD_ROUTE_CLIENT_TOKEN."
        }

    - name: Rust Cache
      uses: swatinem/rust-cache@v2

    - name: Set up Python for audio-description tests
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: "pip"
        cache-dependency-path: bridge/requirements-test.txt

    - name: Install audio-description test dependencies
      run: python -m pip install -r bridge/requirements-test.txt

    - name: Audio-description Python tests
      run: python bridge/run_audio_description_tests.py

    # --- INIZIO BLOCCO VCPKG (FIXED) ---
    - name: Set VCPKG_ROOT Environment
      # Imposta la root di vcpkg (già presente nell'immagine windows-latest)
      run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
      shell: powershell

    - name: Cache vcpkg (installed + downloads)
      id: vcpkg-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}\vcpkg_installed
          C:\vcpkg\downloads
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg dependencies
      # Se la cache c'è (cache-hit), salta questo passaggio per risparmiare tempo
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: powershell
      run: vcpkg install --triplet x64-windows --x-install-root="${{ github.workspace }}\vcpkg_installed"

    - name: Set FFMPEG_DIR for Rust
      # Collega la build di vcpkg alla variabile che Rust si aspetta
      # Vcpkg in manifest mode installa in vcpkg_installed nella root del progetto
      run: echo "FFMPEG_DIR=${{ github.workspace }}\vcpkg_installed\x64-windows" >> $env:GITHUB_ENV
      shell: powershell
    # --- FINE BLOCCO VCPKG (FIXED) ---

    - name: Format check
      run: cargo fmt --check

    - name: Clippy (advisory)
      run: cargo clippy --all

    - name: Tests
      run: cargo test --all

    - name: Install NSIS and WiX with Retry
      shell: powershell
      run: |
        function Install-WithRetry {
            param([string]$package)
            $maxRetries = 5
            $retryCount = 0
            $completed = $false
            
            while (-not $completed) {
                try {
                    Write-Host "Attempting to install $package (Attempt $($retryCount + 1)/$maxRetries)..."
                    choco install $package -y --no-progress
                    if ($LASTEXITCODE -eq 0) {
                        $completed = $true
                        Write-Host "Successfully installed $package"
                    } else {
                        throw "Exit code $LASTEXITCODE"
                    }
                } catch {
                    $retryCount++
                    Write-Error "Failed to install $package. Error: $_"
                    if ($retryCount -ge $maxRetries) {
                        throw "Failed to install $package after $maxRetries attempts."
                    }
                    Write-Host "Waiting 10 seconds before retrying..."
                    Start-Sleep -Seconds 10
                }
            }
        }
        
        Install-WithRetry "nsis"
        Install-WithRetry "wixtoolset"

    - name: Cache cargo-packager
      id: cache-cargo-packager
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/cargo-packager.exe
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
        key: ${{ runner.os }}-cargo-packager-locked

    - name: Install cargo-packager
      if: steps.cache-cargo-packager.outputs.cache-hit != 'true'
      run: cargo install cargo-packager --locked

    - name: Build Standalone (Release)
      run: cargo build --verbose --release --features standalone

    - name: Prepare Standalone Artifact
      shell: powershell
      run: |
        Copy-Item -Path "target/release/sonarpad.exe" -Destination "target/release/sonarpad-standalone.exe" -Force

    - name: Build (Release)
      run: cargo build --verbose --release

    - name: Download Sentry CLI
      shell: powershell
      run: |
        $cli = "$env:RUNNER_TEMP\\sentry-cli.exe"
        Invoke-WebRequest -Uri "https://downloads.sentry-cdn.com/sentry-cli/latest/sentry-cli-Windows-x86_64.exe" -OutFile $cli
        echo "SENTRY_CLI=$cli" >> $env:GITHUB_ENV

    - name: Upload PDBs to Sentry
      if: env.SENTRY_AUTH_TOKEN != ''
      shell: powershell
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      run: |
        if (-not $env:SENTRY_ORG -or -not $env:SENTRY_PROJECT) {
          Write-Host "Sentry org/project not set; skipping PDB upload."
          exit 0
        }
        $pdbs = Get-ChildItem -Path "target/release" -Recurse -Filter *.pdb
        if ($pdbs.Count -eq 0) {
          Write-Host "No PDBs found; skipping PDB upload."
          exit 0
        }
        & $env:SENTRY_CLI upload-dif --org $env:SENTRY_ORG --project $env:SENTRY_PROJECT --wait $pdbs.FullName

    - name: Package Application (NSIS) with Retry
      shell: powershell
      run: |
        $maxAttempts = 5
        $delaySeconds = 10

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          Write-Host "Packaging NSIS installer (Attempt $attempt/$maxAttempts)..."
          & cargo packager --release --formats nsis
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            Write-Host "NSIS packaging completed successfully."
            break
          }

          if ($attempt -eq $maxAttempts) {
            throw "NSIS packaging failed after $maxAttempts attempts (last exit code: $exitCode)."
          }

          Write-Warning "NSIS packaging failed with exit code $exitCode. Retrying in $delaySeconds seconds..."
          Start-Sleep -Seconds $delaySeconds
        }

    - name: Generate WiX Artifacts
      run: cargo packager --release --formats wix || cmd /c "exit /b 0"

    - name: Package Application (MSI)
      shell: powershell
      run: .\scripts\build_msi.ps1

    - name: List target directory (Debug)
      shell: powershell
      run: Get-ChildItem -Path target/release -Recurse

    - name: Generate GitHub build info and SHA256 hashes
      shell: powershell
      run: |
        $outDir = "target/release"

        $buildInfo = @"
        Sonarpad official GitHub Actions build

        Repository: $env:GITHUB_REPOSITORY
        Workflow: $env:GITHUB_WORKFLOW
        Run ID: $env:GITHUB_RUN_ID
        Run number: $env:GITHUB_RUN_NUMBER
        Run attempt: $env:GITHUB_RUN_ATTEMPT
        Commit SHA: $env:GITHUB_SHA
        Ref: $env:GITHUB_REF
        Actor: $env:GITHUB_ACTOR
        Build URL: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
        "@

        $buildInfo | Out-File -FilePath "$outDir/GITHUB_BUILD_INFO.txt" -Encoding utf8

        $files = @()
        $files += Get-Item "$outDir/sonarpad.exe" -ErrorAction SilentlyContinue
        $files += Get-Item "$outDir/sonarpad-standalone.exe" -ErrorAction SilentlyContinue
        $files += Get-ChildItem "$outDir" -Filter "*-setup.exe" -ErrorAction SilentlyContinue
        $files += Get-ChildItem "$outDir" -Filter "*.msi" -ErrorAction SilentlyContinue

        if ($files.Count -eq 0) {
          throw "No release files found for SHA256 generation."
        }

        $hashLines = foreach ($file in $files) {
          $hash = Get-FileHash -Algorithm SHA256 -Path $file.FullName
          "$($hash.Hash.ToLower())  $($file.Name)"
        }

        $hashLines | Out-File -FilePath "$outDir/SHA256SUMS.txt" -Encoding ascii

        Write-Host "Generated SHA256SUMS.txt:"
        Get-Content "$outDir/SHA256SUMS.txt"

    - name: Attest GitHub build provenance
      if: github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: |
          target/release/sonarpad.exe
          target/release/sonarpad-standalone.exe
          target/release/*-setup.exe
          target/release/*.msi
          target/release/SHA256SUMS.txt
          target/release/GITHUB_BUILD_INFO.txt

    - name: Upload Portable (Exe)
      uses: actions/upload-artifact@v4
      with:
        name: Sonarpad-Portable
        path: target/release/sonarpad.exe

    - name: Upload Standalone (Exe)
      uses: actions/upload-artifact@v4
      with:
        name: Sonarpad-Standalone
        path: target/release/sonarpad-standalone.exe

    - name: Upload Setup (NSIS)
      uses: actions/upload-artifact@v4
      with:
        name: Sonarpad-Setup
        path: target/release/*-setup.exe

    - name: Upload Installer (MSI)
      uses: actions/upload-artifact@v4
      with:
        name: Sonarpad-MSI
        path: target/release/*.msi

    - name: Upload SHA256 hashes
      uses: actions/upload-artifact@v4
      with:
        name: Sonarpad-SHA256SUMS
        path: target/release/SHA256SUMS.txt

    - name: Upload GitHub build info
      uses: actions/upload-artifact@v4
      with:
        name: Sonarpad-GitHub-Build-Info
        path: target/release/GITHUB_BUILD_INFO.txt
